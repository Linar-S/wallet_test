services:
  db:
    image: postgres:16-alpine
    container_name: wallet-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wallet_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wallet_password}
      POSTGRES_DB: ${POSTGRES_DB:-wallet_db}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - wallet_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wallet_user} -d ${POSTGRES_DB:-wallet_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: wallet-app
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wallet_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wallet_password}
      POSTGRES_DB: ${POSTGRES_DB:-wallet_db}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      APP_NAME: Wallet API
      DEBUG: "false"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  wallet_pg_data: